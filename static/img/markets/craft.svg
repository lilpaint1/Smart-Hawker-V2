<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="rgba(0,0,0,0.15)"/>
  <!-- Weave pattern background -->
  <rect x="150" y="120" width="500" height="200" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <!-- Basket weave lines horizontal -->
  <line x1="170" y1="140" x2="630" y2="140" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="170" y1="160" x2="630" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="170" y1="180" x2="630" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="170" y1="200" x2="630" y2="200" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="170" y1="220" x2="630" y2="220" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="170" y1="240" x2="630" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="170" y1="260" x2="630" y2="260" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="170" y1="280" x2="630" y2="280" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Basket weave lines vertical -->
  <line x1="200" y1="120" x2="200" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="260" y1="120" x2="260" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="320" y1="120" x2="320" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="380" y1="120" x2="380" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="440" y1="120" x2="440" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="500" y1="120" x2="500" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="560" y1="120" x2="560" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="620" y1="120" x2="620" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Scissors icon center -->
  <circle cx="400" cy="210" r="55" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="4"/>
  <line x1="375" y1="185" x2="425" y2="235" stroke="rgba(255,255,255,0.9)" stroke-width="6" stroke-linecap="round"/>
  <line x1="375" y1="235" x2="425" y2="185" stroke="rgba(255,255,255,0.9)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="370" cy="180" r="12" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5"/>
  <circle cx="430" cy="180" r="12" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5"/>
  <text x="400" y="390" font-family="'Noto Sans Thai', sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">ตลาดงานฝีมือ</text>
  <text x="400" y="430" font-family="'Noto Sans Thai', sans-serif" font-size="22" fill="rgba(255,255,255,0.8)" text-anchor="middle">Craft &amp; Artisan Market</text>
