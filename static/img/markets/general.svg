<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="rgba(0,0,0,0.12)"/>
  <!-- Market canopy -->
  <polygon points="260,160 540,160 580,220 220,220" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.6)" stroke-width="4"/>
  <!-- Stripe on canopy -->
  <line x1="300" y1="160" x2="260" y2="220" stroke="rgba(255,255,255,0.35)" stroke-width="20"/>
  <line x1="380" y1="160" x2="340" y2="220" stroke="rgba(255,255,255,0.35)" stroke-width="20"/>
  <line x1="460" y1="160" x2="420" y2="220" stroke="rgba(255,255,255,0.35)" stroke-width="20"/>
  <!-- Market body -->
  <rect x="240" y="220" width="320" height="110" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="4"/>
  <!-- Door -->
  <rect x="370" y="250" width="60" height="80" rx="6" fill="rgba(255,255,255,0.35)"/>
  <!-- Windows -->
  <rect x="270" y="240" width="60" height="50" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="470" y="240" width="60" height="50" rx="4" fill="rgba(255,255,255,0.3)"/>
  <!-- Flag poles -->
  <line x1="250" y1="100" x2="250" y2="160" stroke="rgba(255,255,255,0.7)" stroke-width="4"/>
  <polygon points="250,105 290,118 250,131" fill="rgba(255,255,255,0.7)"/>
  <line x1="550" y1="100" x2="550" y2="160" stroke="rgba(255,255,255,0.7)" stroke-width="4"/>
  <polygon points="550,105 510,118 550,131" fill="rgba(255,255,255,0.7)"/>
  <text x="400" y="390" font-family="'Noto Sans Thai', sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">ตลาดทั่วไป</text>
  <text x="400" y="430" font-family="'Noto Sans Thai', sans-serif" font-size="22" fill="rgba(255,255,255,0.8)" text-anchor="middle">General Market</text>
</svg>
