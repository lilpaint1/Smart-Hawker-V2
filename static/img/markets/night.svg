<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- Stars -->
  <circle cx="150" cy="80" r="3" fill="#fef3c7" opacity="0.9"/>
  <circle cx="250" cy="50" r="2" fill="#fef3c7" opacity="0.7"/>
  <circle cx="350" cy="90" r="2.5" fill="#fef3c7" opacity="0.8"/>
  <circle cx="500" cy="60" r="2" fill="#fef3c7" opacity="0.9"/>
  <circle cx="600" cy="90" r="3" fill="#fef3c7" opacity="0.7"/>
  <circle cx="680" cy="50" r="2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="720" cy="120" r="2.5" fill="#fef3c7" opacity="0.6"/>
  <circle cx="100" cy="150" r="2" fill="#fef3c7" opacity="0.7"/>
  <circle cx="760" cy="80" r="2" fill="#fef3c7" opacity="0.8"/>
  <!-- Moon -->
  <circle cx="550" cy="120" r="50" fill="url(#moon)" opacity="0.9"/>
  <circle cx="575" cy="100" r="42" fill="#1e1b4b" opacity="0.85"/>
  <!-- String lights -->
  <path d="M100 200 Q200 210 300 200 Q400 190 500 200 Q600 210 700 200" stroke="rgba(255,220,50,0.6)" stroke-width="2" fill="none"/>
  <circle cx="150" cy="205" r="6" fill="#fbbf24" opacity="0.9"/>
  <circle cx="250" cy="198" r="6" fill="#f97316" opacity="0.9"/>
  <circle cx="350" cy="195" r="6" fill="#fbbf24" opacity="0.9"/>
  <circle cx="450" cy="197" r="6" fill="#ef4444" opacity="0.9"/>
  <circle cx="550" cy="204" r="6" fill="#fbbf24" opacity="0.9"/>
  <circle cx="650" cy="200" r="6" fill="#f97316" opacity="0.9"/>
  <!-- Stall silhouettes -->
  <rect x="120" y="270" width="100" height="80" rx="4" fill="rgba(255,255,255,0.1)" stroke="rgba(255,200,50,0.5)" stroke-width="2"/>
  <rect x="250" y="260" width="100" height="90" rx="4" fill="rgba(255,255,255,0.1)" stroke="rgba(255,200,50,0.5)" stroke-width="2"/>
  <rect x="380" y="270" width="100" height="80" rx="4" fill="rgba(255,255,255,0.1)" stroke="rgba(255,200,50,0.5)" stroke-width="2"/>
  <rect x="510" y="255" width="100" height="95" rx="4" fill="rgba(255,255,255,0.1)" stroke="rgba(255,200,50,0.5)" stroke-width="2"/>
  <text x="400" y="400" font-family="'Noto Sans Thai', sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">ตลาดนัดกลางคืน</text>
  <text x="400" y="438" font-family="'Noto Sans Thai', sans-serif" font-size="22" fill="rgba(255,220,80,0.9)" text-anchor="middle">Night Market</text>
</svg>
